name: Eclipse build
# Builds the 64-bit game with and without Super Mario Eclipse on each platform
# and starts it far enough to see whether the mods' constructors were linked in
# where platform/mods/modhooks.cpp finds them. No disc image is used. It
# builds with the toolsets SMS Launcher downloads for players
# (chasem-dev/sms-launcher, src/build-tools.js), through tools/ci/launcher-tools.js.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      launcher-ref:
        description: sms-launcher branch, tag or commit to take the build tools from
        type: string
        default: main
permissions:
  contents: read
jobs:
  eclipse:
    strategy:
      fail-fast: false
      matrix:
        eclipse: ['1', '0']
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: node tools/ci/launcher-tools.js shell {0}
        working-directory: Eclipse CI with spaces/port
    name: ${{ matrix.os }}${{ matrix.eclipse == '1' && ' Eclipse' || ' Sunshine' }}
    env:
      SMS_ARCH: '64'
      SMS_ECLIPSE: ${{ matrix.eclipse }}
      SMS_LAUNCHER_DIR: ${{ github.workspace }}/Eclipse CI with spaces/launcher
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: Eclipse CI with spaces/port
      - uses: actions/checkout@v4
        with:
          repository: chasem-dev/sms-launcher
          ref: ${{ inputs.launcher-ref || 'main' }}
          path: Eclipse CI with spaces/launcher
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Intel execution on the Apple Silicon CI runner
        if: runner.os == 'macOS'
        shell: bash
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Install the launcher's build tools
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix "$SMS_LAUNCHER_DIR"
          node tools/ci/launcher-tools.js prepare
      - name: Test partial-link response files with long paths
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then python tools/mods/tests/test_object_response.py
          else python3 tools/mods/tests/test_object_response.py; fi
      - name: Build Eclipse
        run: ./build.sh
      - name: Check that the build used the launcher's compilers
        shell: bash
        run: node tools/ci/launcher-tools.js check build/*-64$([[ "$SMS_ECLIPSE" != 1 ]] || echo -eclipse)
      - name: Check whether the mods are linked in
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then os=linux; elif [[ "$RUNNER_OS" == macOS ]]; then os=macos; else os=windows; fi
          exe=build/$os-64$([[ "$SMS_ECLIPSE" != 1 ]] || echo -eclipse)/sms
          [[ "$os" != windows ]] || exe+=.exe
          head -c 32 /dev/zero > invalid.iso
          set +e
          # The launcher's tools live under a path with spaces.
          limit=$(command -v timeout || command -v gtimeout || true)
          limit=(${limit:+"$limit" 60})
          SMS_CODE_MODS=0 SMS_HEADLESS=1 SMS_SAVE_DIR="$PWD/test-saves" SMS_DISC_IMAGE="$PWD/invalid.iso" \
            "${limit[@]}" "$exe" "$PWD/invalid.iso" > start.log 2>&1
          echo "exit status $?"
          set -e
          cat start.log
          if [[ "$SMS_ECLIPSE" == 1 ]]; then grep -q 'code mods linked in but switched off' start.log
          else ! grep -q 'code mods linked in' start.log; fi
          grep -q 'not a usable GameCube disc image' start.log
      - name: Show the Windows executable's sections
        if: failure() && runner.os == 'Windows'
        run: |
          exe=build/windows-64$([[ "$SMS_ECLIPSE" != 1 ]] || echo -eclipse)/sms.exe
          ls -l "$exe"
          objdump -p "$exe" | sed -n '1,60p'
          objdump -h "$exe"
