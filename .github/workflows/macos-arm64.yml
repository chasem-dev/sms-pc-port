name: macOS arm64
# The native Apple Silicon build (SMS_ARCH=arm64, docs/MACOS-ARM64.md) with
# Homebrew's LLVM, as BUILD.md describes: tools/gameptr's pass plugin and its
# test, then the game with the Vulkan backend and MoltenVK. No disc image is
# used.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One run per pull request, and one for main (cancel-superseded.yml stops a
  # pull request's runs once it is merged or closed).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install LLVM
        run: |
          brew install llvm
          "$(brew --prefix llvm)/bin/clang" --version
      - name: Check the pass plugin
        run: tools/gameptr/test.sh
      - name: Build the native arm64 game
        env:
          SMS_ARCH: arm64
          SMS_STANDALONE: '0'
          JOBS: '3'
        run: ./build.sh
      - name: Check the executable
        run: |
          exe=build/macos-arm64/sms
          file "$exe"
          lipo -archs "$exe" | grep -qx arm64
          codesign --verify --strict "$exe"
          # the Vulkan backend's library, beside it
          test -f build/macos-arm64/libMoltenVK.dylib
          lipo -archs build/macos-arm64/libMoltenVK.dylib | grep -qw arm64
          # and the backend itself (configure leaves it out when a dependency
          # cannot be fetched, which would pass silently otherwise)
          nm "$exe" | grep -q '__ZN4glvk7getProcEPKc'
